name: Build iOS App

on:
  push:
    branches: [ main, claude/friendly-davinci-kz02xp ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync to iOS
        run: npx cap sync ios

      - name: Set up Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build iOS app (unsigned development)
        run: |
          cd ios/App
          xcodebuild -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            -arch arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | grep -i "error\|warning" || true

      - name: Create unsigned IPA
        run: |
          cd ios/App
          mkdir -p build/ipa
          cp -r build/Build/Products/Debug-iphoneos/App.app build/ipa/
          cd build/ipa
          mkdir -p App.ipa/Payload
          mv App.app App.ipa/Payload/
          cd App.ipa
          zip -r ../App-unsigned.ipa Payload
          cd ..
          rm -rf App.ipa

      - name: Upload iOS IPA (unsigned development build)
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: ios/App/build/ipa/App-unsigned.ipa
          retention-days: 30

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: dist/
          retention-days: 30
